<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROOKIE & KING | Hardened Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root {
  --bg-main: #0b0f19;
  --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #1e1b4b 50%, #311042 100%);
  --panel-bg: rgba(255, 255, 255, 0.06);
  --panel-border: rgba(255, 255, 255, 0.12);
  --accent-primary: #f43f5e;
  --accent-secondary: #fb923c;
  --accent-glow: rgba(244, 63, 94, 0.35);
  --text-main: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.65);
  
  --board-light: #f3e8ff;
  --board-dark: #7c3aed;
  --square-highlight: rgba(251, 146, 60, 0.8);
  --move-dot: #f43f5e;
}

body.theme-cyber {
  --bg-gradient: linear-gradient(135deg, #022c22 0%, #0f172a 50%, #0284c7 100%);
  --panel-border: rgba(56, 189, 248, 0.2);
  --accent-primary: #38bdf8;
  --accent-secondary: #34d399;
  --accent-glow: rgba(56, 189, 248, 0.35);
  --board-light: #e0f2fe;
  --board-dark: #0284c7;
  --square-highlight: rgba(52, 211, 153, 0.8);
  --move-dot: #38bdf8;
}

body.theme-electric {
  --bg-gradient: linear-gradient(135deg, #18002e 0%, #4c0519 50%, #831843 100%);
  --panel-border: rgba(244, 114, 182, 0.2);
  --accent-primary: #f472b6;
  --accent-secondary: #facc15;
  --accent-glow: rgba(244, 114, 182, 0.35);
  --board-light: #fce7f3;
  --board-dark: #db2777;
  --square-highlight: rgba(250, 204, 21, 0.85);
  --move-dot: #f472b6;
}

*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; padding: 0; 
  touch-action: manipulation;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

.app-header {
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--panel-border);
  background: rgba(11, 15, 25, 0.8);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}

.brand-container { display: flex; align-items: center; gap: 10px; }
.brand-logo-emblem {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px var(--accent-glow);
}
.brand-logo-emblem svg { width: 22px; height: 22px; fill: #ffffff; }

.brand-text {
  font-family: 'Outfit', sans-serif;
  font-weight: 900;
  font-size: 18px;
  letter-spacing: -0.01em;
  background: linear-gradient(90deg, #ffffff, var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.coin-badge {
  background: rgba(251, 146, 60, 0.12);
  border: 1px solid var(--accent-secondary);
  color: var(--accent-secondary);
  padding: 4px 10px;
  border-radius: 16px;
  font-weight: 800;
  font-size: 12px;
}

.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr 300px;
  gap: 16px;
  max-width: 1380px;
  width: 100%;
  margin: 0 auto;
  padding: 16px;
}

@media (max-width: 960px) {
  .workspace {
    display: flex;
    flex-direction: column;
    padding: 12px;
  }
}

.card-panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.section-label {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-secondary);
}

.board-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.player-strip {
  width: 100%;
  max-width: 480px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.player-info { display: flex; align-items: center; gap: 10px; }
.avatar-ring {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
  padding: 2px;
}
.avatar-inner {
  width: 100%; height: 100%;
  background: #000;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 10px; color: #fff;
}

#chessboard {
  width: min(100%, 480px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 12px 36px rgba(0,0,0,0.6);
}

.square {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}
.square.light { background-color: var(--board-light); }
.square.dark { background-color: var(--board-dark); }
.square.selected { background-color: var(--square-highlight) !important; }

.square.valid-move::after {
  content: ''; position: absolute; width: 14px; height: 14px;
  background: var(--move-dot); border-radius: 50%; opacity: 0.85;
  box-shadow: 0 0 8px var(--move-dot);
}

.piece {
  width: 86%; height: 86%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* VECTOR PIECE SET */
.piece.wP { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg'); }
.piece.wR { background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg'); }
.piece.wN { background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg'); }
.piece.wB { background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg'); }
.piece.wQ { background-image: url('https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg'); }
.piece.wK { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'); }

.piece.bP { background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg'); }
.piece.bR { background-image: url('https://upload.wikimedia.org/wikipedia/commons/ff/ff/Chess_rdt45.svg'); }
.piece.bN { background-image: url('https://upload.wikimedia.org/wikipedia/commons/ef/ef/Chess_ndt45.svg'); }
.piece.bB { background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg'); }
.piece.bQ { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg'); }
.piece.bK { background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'); }

.btn-primary {
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  color: #fff; border: none; padding: 10px; border-radius: 10px;
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px;
  cursor: pointer; width: 100%; text-align: center;
}

.input-select {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--panel-border);
  color: #fff; padding: 8px 10px; border-radius: 8px;
  font-size: 12px; font-weight: 700; width: 100%; outline: none;
}

.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }

.modal-card {
  background: #111827; border: 1px solid var(--panel-border);
  border-radius: 20px; padding: 24px; max-width: 360px; width: 90%;
  text-align: center;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand-container">
    <div class="brand-logo-emblem">
      <svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
    </div>
    <div class="brand-text">ROOKIE & KING</div>
  </div>

  <div style="display:flex; gap:10px; align-items:center;">
    <div class="coin-badge">🪙 <span id="coin-balance">250</span></div>
    <select class="input-select" style="width:auto;" onchange="switchTheme(this.value)">
      <option value="sunset">Sunset</option>
      <option value="cyber">Cyber</option>
      <option value="electric">Electric</option>
    </select>
  </div>
</header>

<main class="workspace">
  
  <aside class="card-panel">
    <div class="section-label">Game Settings</div>
    
    <div>
      <label style="font-size:10px; color:var(--text-muted); font-weight:700;">MODE</label>
      <select class="input-select" id="game-mode-select">
        <option value="ai">vs Practice AI Engine</option>
        <option value="invite">LinkedIn Challenge Link</option>
      </select>
    </div>

    <div>
      <label style="font-size:10px; color:var(--text-muted); font-weight:700;">AI ENGINE LEVEL</label>
      <select class="input-select" id="ai-difficulty">
        <option value="1">Lvl 1 - Intern (Random)</option>
        <option value="2" selected>Lvl 2 - Associate (Heuristic)</option>
        <option value="3">Lvl 3 - VP (Tactical)</option>
      </select>
    </div>

    <button class="btn-primary" onclick="startNewGame()">New Match</button>
  </aside>

  <section class="board-stage">
    <div class="player-strip">
      <div class="player-info">
        <div class="avatar-ring"><div class="avatar-inner" id="opponent-avatar">AI</div></div>
        <div>
          <div style="font-weight:700; font-size:13px;" id="opponent-name">AI Engine</div>
          <div style="font-size:10px; color:var(--text-muted);" id="opponent-status">Level 2 Active</div>
        </div>
      </div>
    </div>

    <div id="chessboard"></div>

    <div class="player-strip">
      <div class="player-info">
        <div class="avatar-ring"><div class="avatar-inner">YOU</div></div>
        <div>
          <div style="font-weight:700; font-size:13px;">Executive Player</div>
          <div style="font-size:10px; color:var(--text-muted);">Verified User</div>
        </div>
      </div>
    </div>
  </section>

  <aside class="card-panel">
    <div class="section-label">Progression & Incentives</div>
    <p style="font-size:12px; color:var(--text-muted);">Win games to accumulate Coins for executive networking perks.</p>
    <button class="btn-primary" style="background: rgba(251,146,60,0.15); border: 1px solid var(--accent-secondary);" onclick="redeemInMail()">
      Redeem InMail Pitch Pass (150c)
    </button>
  </aside>

</main>

<script>
const VALUES = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
const game = new Chess();
let selectedSquare = null;
let userCoins = 250;

function renderBoard() {
  const boardEl = document.getElementById('chessboard');
  boardEl.innerHTML = '';
  const board = game.board();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sqName = String.fromCharCode(97 + c) + (8 - r);
      const squareEl = document.createElement('div');
      squareEl.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
      squareEl.dataset.square = sqName;

      const piece = board[r][c];
      if (piece) {
        const pieceEl = document.createElement('div');
        pieceEl.className = `piece ${piece.color}${piece.type.toUpperCase()}`;
        squareEl.appendChild(pieceEl);
      }

      squareEl.addEventListener('click', () => handleSquareClick(sqName));
      boardEl.appendChild(squareEl);
    }
  }
}

function handleSquareClick(sq) {
  if (selectedSquare === sq) {
    clearHighlights();
    selectedSquare = null;
    return;
  }

  if (selectedSquare) {
    const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
    if (move) {
      selectedSquare = null;
      clearHighlights();
      renderBoard();
      if (!game.game_over()) setTimeout(executeAIMove, 300);
      return;
    }
  }

  const piece = game.get(sq);
  if (piece && piece.color === game.turn()) {
    selectedSquare = sq;
    highlightSquare(sq);
  }
}

function highlightSquare(sq) {
  clearHighlights();
  document.querySelector(`[data-square="${sq}"]`)?.classList.add('selected');
  game.moves({ square: sq, verbose: true }).forEach(m => {
    document.querySelector(`[data-square="${m.to}"]`)?.classList.add('valid-move');
  });
}

function clearHighlights() {
  document.querySelectorAll('.square').forEach(el => el.classList.remove('selected', 'valid-move'));
}

/* TACTICAL HEURISTIC EVALUATION FOR AI */
function executeAIMove() {
  const moves = game.moves({ verbose: true });
  if (moves.length === 0) return;

  const level = document.getElementById('ai-difficulty').value;
  let selectedMove = null;

  if (level === "1") {
    selectedMove = moves[Math.floor(Math.random() * moves.length)];
  } else {
    // Score-based move selection (Level 2 & 3)
    moves.forEach(m => {
      let score = 0;
      if (m.captured) score += VALUES[m.captured] * 10;
      if (m.san.includes('+')) score += 15;
      if (m.san.includes('#')) score += 1000;
      m.score = score;
    });

    moves.sort((a, b) => b.score - a.score);
    selectedMove = moves[0].score > 0 ? moves[0] : moves[Math.floor(Math.random() * moves.length)];
  }

  game.move(selectedMove);
  renderBoard();
}

function switchTheme(theme) {
  document.body.className = theme === 'sunset' ? '' : `theme-${theme}`;
}

function redeemInMail() {
  if (userCoins >= 150) {
    userCoins -= 150;
    document.getElementById('coin-balance').innerText = userCoins;
    alert('Pitch Pass Unlocked!');
  } else {
    alert('Insufficient Coins');
  }
}

function startNewGame() {
  game.reset();
  renderBoard();
}

renderBoard();
</script>
</body>
</html>
