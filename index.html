<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>E4 CONNECT | LinkedIn Professional Tactical Chess</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Strict Chess Rules Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
/* ── THEME DEFINITIONS ────────────────────────────────── */
:root {
  /* Default Theme: 3SDS Emerald Glass */
  --bg-deep: #030806;
  --bg-surface: #0a140f;
  --bg-glass: rgba(14, 26, 20, 0.85);
  --primary-accent: #8ae87f;
  --primary-glow: rgba(138, 232, 127, 0.25);
  --text-main: #f0f7f2;
  --text-muted: rgba(240, 247, 242, 0.65);
  --border-glass: rgba(138, 232, 127, 0.2);
  --board-light: #2b3a31;
  --board-dark: #121e17;
  --square-select: rgba(0, 229, 255, 0.45);
  --square-move: rgba(138, 232, 127, 0.5);
}

body.theme-executive {
  --bg-deep: #080c14;
  --bg-surface: #0f172a;
  --bg-glass: rgba(15, 23, 42, 0.85);
  --primary-accent: #f59e0b;
  --primary-glow: rgba(245, 158, 11, 0.25);
  --text-main: #f8fafc;
  --text-muted: rgba(248, 250, 252, 0.65);
  --border-glass: rgba(245, 158, 11, 0.2);
  --board-light: #334155;
  --board-dark: #0f172a;
  --square-select: rgba(56, 189, 248, 0.45);
  --square-move: rgba(245, 158, 11, 0.5);
}

body.theme-monochrome {
  --bg-deep: #0f0f11;
  --bg-surface: #18181b;
  --bg-glass: rgba(24, 24, 27, 0.85);
  --primary-accent: #ffffff;
  --primary-glow: rgba(255, 255, 255, 0.15);
  --text-main: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --border-glass: rgba(255, 255, 255, 0.15);
  --board-light: #3f3f46;
  --board-dark: #18181b;
  --square-select: rgba(161, 161, 170, 0.5);
  --square-move: rgba(255, 255, 255, 0.6);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg-deep);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.3s ease;
}

/* ── HEADER & CONTROL BAR ────────────────────────────── */
.app-header {
  height: 72px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-glass);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}
.brand-logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-badge {
  background: var(--primary-accent);
  color: #000;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 99px;
  text-transform: uppercase;
}
.controls-group { display: flex; align-items: center; gap: 12px; }
.theme-select, .btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-glass);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  cursor: pointer;
  outline: none;
}

/* ── MAIN LAYOUT ─────────────────────────────────────── */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 300px 1fr 320px;
  gap: 24px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
}
@media (max-width: 1024px) {
  .workspace { grid-template-columns: 1fr; }
}

.panel-card {
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-glass);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.panel-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--primary-accent);
  font-weight: 700;
}

/* ── CHESSBOARD ──────────────────────────────────────── */
.board-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.player-strip {
  width: 100%;
  max-width: 540px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-glass);
  padding: 10px 16px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.player-info { display: flex; align-items: center; gap: 10px; }
.player-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--primary-accent); color: #000;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}

#chessboard {
  width: min(100%, 540px);
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid var(--border-glass);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
}
.square {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}
.square.light { background-color: var(--board-light); }
.square.dark { background-color: var(--board-dark); }
.square.selected { background-color: var(--square-select) !important; }
.square.valid-move::after {
  content: ''; position: absolute; width: 14px; height: 14px;
  background: var(--primary-accent); border-radius: 50%; opacity: 0.75;
}

/* Standard HD Pieces (Cburnett Set) */
.piece {
  width: 85%; height: 85%;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  transition: transform 0.12s ease;
}
.piece:hover { transform: scale(1.08); }

/* White Pieces */
.piece.wP { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg'); }
.piece.wR { background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg'); }
.piece.wN { background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg'); }
.piece.wB { background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg'); }
.piece.wQ { background-image: url('https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg'); }
.piece.wK { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'); }

/* Black Pieces */
.piece.bP { background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg'); }
.piece.bR { background-image: url('https://upload.wikimedia.org/wikipedia/commons/ff/ff/Chess_rdt45.svg'); }
.piece.bN { background-image: url('https://upload.wikimedia.org/wikipedia/commons/ef/ef/Chess_ndt45.svg'); }
.piece.bB { background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg'); }
.piece.bQ { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg'); }
.piece.bK { background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'); }

/* ── SIDEBARS & CHAT ─────────────────────────────────── */
.btn-primary {
  background: var(--primary-accent);
  color: #000; border: none; padding: 12px; border-radius: 10px;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700;
  cursor: pointer; transition: transform 0.2s;
}
.btn-primary:hover { transform: translateY(-2px); }

.chat-box {
  flex: 1; background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 10px;
  padding: 10px; display: flex; flex-direction: column; gap: 8px;
  max-height: 240px; overflow-y: auto; font-size: 13px;
}
.status-msg { text-align: center; color: var(--primary-accent); font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand-logo">
    <span>E4 CONNECT</span>
    <span class="brand-badge">3SDS Studio</span>
  </div>
  <div class="controls-group">
    <!-- Theme Switcher -->
    <select class="theme-select" id="theme-switcher" onchange="changeTheme(this.value)">
      <option value="emerald">🌿 Emerald Glass</option>
      <option value="executive">🫐 Midnight Executive</option>
      <option value="monochrome">⚡ Monochrome Pro</option>
    </select>
    <button class="btn-secondary">🔗 Direct Invite</button>
  </div>
</header>

<main class="workspace">
  
  <!-- LEFT: MATCHMAKING -->
  <aside class="panel-card">
    <div class="panel-title">🎯 Professional Match</div>
    
    <div>
      <label style="font-size: 12px; color: var(--text-muted);">Target Industry</label>
      <select class="theme-select" style="width: 100%; margin-top: 4px;">
        <option>AI & Tech Founders</option>
        <option>Venture Capital</option>
        <option>Product & Design</option>
      </select>
    </div>

    <button class="btn-primary" style="margin-top: 8px;">⚡ Find Match (Skip InMail)</button>
  </aside>

  <!-- CENTER: BOARD -->
  <section class="board-stage">
    <div class="player-strip">
      <div class="player-info">
        <div class="player-avatar" style="background:#38bdf8;">VC</div>
        <div>
          <div style="font-weight: 700; font-size: 14px;">Tech Investor [Incognito]</div>
          <div style="font-size: 11px; color: var(--text-muted);">Seed & Series A · AI Focus</div>
        </div>
      </div>
      <div style="font-family: 'Space Grotesk'; font-weight: 700;">10:00</div>
    </div>

    <div id="chessboard"></div>

    <div class="player-strip">
      <div class="player-info">
        <div class="player-avatar">YOU</div>
        <div>
          <div style="font-weight: 700; font-size: 14px;">Your Profile</div>
          <div style="font-size: 11px; color: var(--text-muted);">Product Strategist</div>
        </div>
      </div>
      <div style="font-family: 'Space Grotesk'; font-weight: 700;">10:00</div>
    </div>

    <div class="status-msg" id="game-status">White to move. Select a piece.</div>
  </section>

  <!-- RIGHT: CHAT & CONNECT -->
  <aside class="panel-card">
    <div class="panel-title">💬 Game Chat</div>
    <div class="chat-box" id="chat-messages">
      <div><strong style="color:var(--primary-accent)">System:</strong> Game started. Strict rules active.</div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn-secondary" style="flex:1; font-size:11px;" onclick="sendChat('Good luck!')">👋 Good luck</button>
      <button class="btn-secondary" style="flex:1; font-size:11px;" onclick="sendChat('Great move!')">🎯 Great move</button>
    </div>
  </aside>

</main>

<script>
/* ── AUDIO SFX ────────────────────────────────────────── */
class SoundEngine {
  constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  playMove() {
    let o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(300, this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.08);
  }
}
const sfx = new SoundEngine();

/* ── CHESS LOGIC ─────────────────────────────────────── */
const game = new Chess();
let selectedSquare = null;

function renderBoard() {
  const boardEl = document.getElementById('chessboard');
  boardEl.innerHTML = '';
  const board = game.board();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const squareName = String.fromCharCode(97 + c) + (8 - r);
      const squareEl = document.createElement('div');
      squareEl.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
      squareEl.dataset.square = squareName;

      const piece = board[r][c];
      if (piece) {
        const pieceEl = document.createElement('div');
        pieceEl.className = `piece ${piece.color}${piece.type.toUpperCase()}`;
        squareEl.appendChild(pieceEl);
      }

      squareEl.addEventListener('click', () => handleSquareClick(squareName));
      boardEl.appendChild(squareEl);
    }
  }
  updateStatus();
}

function handleSquareClick(sq) {
  if (selectedSquare === sq) {
    clearHighlights();
    selectedSquare = null;
    return;
  }

  if (selectedSquare) {
    const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
    if (move) {
      sfx.playMove();
      selectedSquare = null;
      clearHighlights();
      renderBoard();
      if (!game.game_over()) setTimeout(makeAIMove, 700);
      return;
    }
  }

  const piece = game.get(sq);
  if (piece && piece.color === game.turn()) {
    selectedSquare = sq;
    highlightSquare(sq);
  }
}

function highlightSquare(sq) {
  clearHighlights();
  document.querySelector(`[data-square="${sq}"]`)?.classList.add('selected');
  game.moves({ square: sq, verbose: true }).forEach(m => {
    document.querySelector(`[data-square="${m.to}"]`)?.classList.add('valid-move');
  });
}

function clearHighlights() {
  document.querySelectorAll('.square').forEach(el => el.classList.remove('selected', 'valid-move'));
}

function makeAIMove() {
  const moves = game.moves({ verbose: true });
  if (moves.length === 0) return;
  game.move(moves[Math.floor(Math.random() * moves.length)]);
  sfx.playMove();
  renderBoard();
}

function updateStatus() {
  const statusEl = document.getElementById('game-status');
  if (game.in_checkmate()) statusEl.innerText = "Checkmate!";
  else if (game.in_check()) statusEl.innerText = `${game.turn() === 'w' ? 'White' : 'Black'} is in Check!`;
  else statusEl.innerText = `${game.turn() === 'w' ? 'White' : 'Black'} to move.`;
}

function changeTheme(themeKey) {
  document.body.className = '';
  if (themeKey !== 'emerald') {
    document.body.classList.add(`theme-${themeKey}`);
  }
}

function sendChat(msg) {
  const box = document.getElementById('chat-messages');
  box.innerHTML += `<div><strong>You:</strong> ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

renderBoard();
</script>
</body>
</html>
